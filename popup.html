<!doctype html>
<html lang="en" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="popup.css">
<title>Beagle Timer</title>
</head>
<body>
<main id="app" data-state="idle">
  <section class="scene" aria-hidden="true">
    <svg viewBox="0 0 260 200" width="260" height="200">
      <defs><clipPath id="headClip"><circle cx="130" cy="98" r="36"/></clipPath></defs>
      <rect class="sky" width="260" height="200"/>
      <g class="day-only">
        <circle cx="222" cy="34" r="15" fill="#ffd95e"/>
        <path d="M30 40 q8 -12 20 -4 q10 -8 18 2 q10 0 8 8 H26 q-4 -2 4 -6Z" fill="#fff" opacity=".9"/>
      </g>
      <g class="night-only">
        <path d="M218 20 a18 18 0 1 0 14 30 a14 14 0 0 1 -14 -30Z" fill="#f6f1c9"/>
        <g fill="#fff"><circle cx="30" cy="30" r="1.6"/><circle cx="70" cy="18" r="1.2"/><circle cx="52" cy="58" r="1.4"/><circle cx="188" cy="62" r="1.3"/><circle cx="160" cy="22" r="1.6"/><circle cx="14" cy="80" r="1.2"/></g>
      </g>
      <rect class="ground" y="168" width="260" height="32"/>

      <g class="night-only">
        <path d="M148 128 Q192 120 194 156 L194 172 Q170 180 148 170Z" fill="#f2a6bd" stroke="#4a2c1d" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M160 136 Q184 134 188 150 M158 150 Q178 150 188 164" stroke="#fff" stroke-width="3" fill="none" opacity=".7" stroke-linecap="round"/>
      </g>

      <g id="tail">
        <path d="M156 146 Q176 142 172 116" stroke="#4a2c1d" stroke-width="11" fill="none" stroke-linecap="round"/>
        <path d="M156 146 Q176 142 172 116" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round"/>
      </g>

      <ellipse cx="130" cy="146" rx="34" ry="26" fill="#fff" stroke="#4a2c1d" stroke-width="2.5"/>
      <path d="M104 134 Q130 122 156 134 Q150 150 130 150 Q110 150 104 134Z" fill="#9a5a34" opacity=".9"/>
      
      <g class="night-only" transform="rotate(-10 72 150)">
        <rect x="50" y="134" width="44" height="32" rx="13" fill="#cfd8ff" stroke="#4a2c1d" stroke-width="2.5"/>
        <path d="M58 146 H86 M58 154 H86" stroke="#8a97e0" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 4"/>
      </g>

     
      <g id="head">
        <ellipse cx="94" cy="106" rx="12" ry="25" transform="rotate(14 94 106)" fill="#8a4b2a" stroke="#4a2c1d" stroke-width="2.5"/>
        <ellipse cx="166" cy="106" rx="12" ry="25" transform="rotate(-14 166 106)" fill="#8a4b2a" stroke="#4a2c1d" stroke-width="2.5"/>
        <circle cx="130" cy="98" r="36" fill="#fff"/>
        <ellipse cx="130" cy="74" rx="26" ry="15" fill="#d9a066" clip-path="url(#headClip)"/>
        <path d="M130 66 V82" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
        <circle cx="130" cy="98" r="36" fill="none" stroke="#4a2c1d" stroke-width="2.5"/>
        <ellipse cx="106" cy="112" rx="6.5" ry="4" fill="#ff9fb2" opacity=".65"/>
        <ellipse cx="154" cy="112" rx="6.5" ry="4" fill="#ff9fb2" opacity=".65"/>
        <g id="eyes">
          <circle cx="116" cy="99" r="6.2" fill="#2b1a17"/><circle cx="118.2" cy="96.8" r="2.2" fill="#fff"/>
          <circle cx="144" cy="99" r="6.2" fill="#2b1a17"/><circle cx="146.2" cy="96.8" r="2.2" fill="#fff"/>
        </g>
        <path id="sleepEyes" d="M110 100 q6 5 12 0 M138 100 q6 5 12 0" stroke="#2b1a17" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <path id="happyEyes" d="M110 101 q6 -8 12 0 M138 101 q6 -8 12 0" stroke="#2b1a17" stroke-width="2.6" fill="none" stroke-linecap="round"/>
        <ellipse cx="130" cy="108" rx="6.5" ry="4.8" fill="#2b1a17"/>
        <ellipse cx="128" cy="106.2" rx="2" ry="1.2" fill="#fff" opacity=".8"/>
        <path d="M130 112 V115 M122.5 116 q3.7 4 7.5 0 q3.8 4 7.5 0" stroke="#2b1a17" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path id="tongue" d="M126 119 q4 8 8 0Z" fill="#ff7f96" stroke="#2b1a17" stroke-width="1.6" stroke-linejoin="round"/>

        <g class="night-only">
          <path d="M97 78 Q104 44 140 50 Q166 56 163 78 Q130 68 97 78Z" fill="#5b6bd6" stroke="#4a2c1d" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M96 79 Q130 66 164 79" stroke="#eef0ff" stroke-width="8" fill="none" stroke-linecap="round"/>
          <path d="M146 52 Q176 44 180 78" stroke="#5b6bd6" stroke-width="12" fill="none" stroke-linecap="round"/>
          <circle cx="180" cy="84" r="7.5" fill="#fff" stroke="#4a2c1d" stroke-width="2"/>
        </g>
      </g>

      
      <g id="book">
        <path d="M93 148 L130 155 L167 148 V172 L130 179 L93 172Z" fill="#3b6fb6" stroke="#4a2c1d" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M98 145 L130 151 V175 L98 169Z M162 145 L130 151 V175 L162 169Z" fill="#fffdf5" stroke="#4a2c1d" stroke-width="2" stroke-linejoin="round"/>
        <path d="M104 153 L124 157 M104 160 L124 164 M156 153 L136 157 M156 160 L136 164" stroke="#c9c2b0" stroke-width="2" stroke-linecap="round"/>
        <ellipse cx="100" cy="166" rx="7.5" ry="6" fill="#fff" stroke="#4a2c1d" stroke-width="2.5"/>
        <ellipse cx="160" cy="166" rx="7.5" ry="6" fill="#fff" stroke="#4a2c1d" stroke-width="2.5"/>
      </g>
      <text id="zzz" x="38" y="78" font-size="15" fill="currentColor" font-weight="700">z z z</text>
    </svg>
  </section>

  <section class="panel">
    <label class="switch">
      <input type="checkbox" id="night" role="switch">
      <span class="track"><span class="thumb"></span></span>
      <span class="lbl">Night mode</span>
    </label>

    <div class="time" id="time" role="timer" aria-live="off">25:00</div>
    <div class="caption" id="caption">Pick a time and start.</div>

    <div class="presets" id="presets">
      <button data-min="5">5</button>
      <button data-min="15">15</button>
      <button data-min="25" class="on">25</button>
      <button data-min="50">50</button>
      <input id="custom" type="number" min="1" max="600" placeholder="min" aria-label="Custom minutes">
    </div>

    <div class="actions">
      <button id="main" class="primary">Start</button>
      <button id="reset">Reset</button>
    </div>
  </section>
</main>
<script src="popup.js"></script>
</body>
</html>
